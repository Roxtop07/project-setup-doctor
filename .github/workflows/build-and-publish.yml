name: Build & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-15
            target: darwin-x64
            python_arch: x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64

    runs-on: ${{ matrix.os }}
    name: Build backend (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch || '' }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller>=6.0.0

      - name: Build binary
        working-directory: backend
        run: pyinstaller securecode-backend.spec --clean --noconfirm

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: backend/dist/securecode-backend/
          retention-days: 1

  package:
    needs: build-backend
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            vsce_target: darwin-arm64
          - target: darwin-x64
            vsce_target: darwin-x64
          - target: linux-x64
            vsce_target: linux-x64
          - target: linux-arm64
            vsce_target: linux-arm64
          - target: win32-x64
            vsce_target: win32-x64

    runs-on: ubuntu-latest
    name: Package (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: extension/bin/${{ matrix.target }}/

      - name: Make binary executable
        if: matrix.target != 'win32-x64'
        run: chmod +x extension/bin/${{ matrix.target }}/securecode-backend

      - name: Bundle backend source (Python fallback)
        working-directory: extension
        run: npm run bundle:backend-src

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Package VSIX
        working-directory: extension
        run: npx vsce package --target ${{ matrix.vsce_target }} --allow-missing-repository

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: extension/*.vsix
          retention-days: 7

  package-universal:
    needs: build-backend
    runs-on: ubuntu-latest
    name: Package (universal)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Bundle backend source (Python fallback)
        working-directory: extension
        run: npm run bundle:backend-src

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Package universal VSIX
        working-directory: extension
        run: npx vsce package --allow-missing-repository

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-universal
          path: extension/*.vsix
          retention-days: 7

  publish:
    needs: [package, package-universal]
    runs-on: ubuntu-latest
    name: Publish to OpenVSX
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all VSIX files
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ovsx
        run: npm install -g ovsx

      - name: Publish to OpenVSX
        run: |
          for vsix in vsix/*.vsix; do
            echo "Publishing $vsix..."
            ovsx publish "$vsix" -p ${{ secrets.OVSX_PAT }}
          done

  release:
    needs: [package, package-universal]
    runs-on: ubuntu-latest
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all VSIX files
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: vsix/*.vsix
          generate_release_notes: true
